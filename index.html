<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Introduction Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #172554;
            color: white;
            padding: 40px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 40px;
        }

        .member {
            background: white;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .member img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .member h2 {
            margin: 15px 0 8px;
        }

        .member p {
            color: #555;
        }

        footer {
            background: #172554;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Our Team</h1>
        <p>Welcome to our Product Development Team</p>
    </header>

    <section class="team">

        <div class="member">
            <img src="https://via.placeholder.com/120" alt="Daivik">
            <h2>Daivik</h2>
            <p>Department: Computer Science</p>
            <p>Frontend Developer</p>
        </div>

        <div class="member">
            <img src="https://via.placeholder.com/120" alt="Srujan">
            <h2>Srujan</h2>
            <p>Department: Software Development</p>
            <p>Backend Developer</p>
        </div>

        <div class="member">
            <img src="https://via.placeholder.com/120" alt="Sai">
            <h2>Sai</h2>
            <p>Department: Design</p>
            <p>UI/UX Designer</p>
        </div>

    </section>

    <footer>
        <p>Team Introduction Page © 2026</p>
    </footer>

</body>
</html>
